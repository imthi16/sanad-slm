# SOPS + age — git-native encrypted secrets, no cloud KMS dependency (CLAUDE.md §3.5).
# Replace the placeholder recipient with the team age public key(s) before first encryption:
#   age-keygen -o ~/.config/sops/age/keys.txt
creation_rules:
  - path_regex: secrets/.*\.sops\.yaml$
    age: "age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq" # PLACEHOLDER — replace
    encrypted_regex: "^(data|stringData|password|token|secret|key|.*_KEY|.*_TOKEN|.*_PASSWORD)$"
