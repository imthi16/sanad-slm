# Dataset manifest — regenerated by `data/scripts/manifest.py build`; CI license gate reads it.
# `just data-gate` fails if any record's license ∉ {Apache-2.0, CC-BY-4.0, MIT} while
# profile: commercial (prime directive 2). The provenance split is printed into every eval
# report as a rigor signal.
profile: commercial
allowed_licenses: [Apache-2.0, CC-BY-4.0, MIT]
generated_by: data/scripts/manifest.py
generated_at: null # set on `just data`

sources:
  - name: CIDAR
    url: hf:arbml/CIDAR
    license: Apache-2.0
    role: native instruction core
    provenance: native
    count: 0 # populated by ingest
  - name: sanad-bank-pairs
    url: local:data/raw/bank
    license: CC-BY-4.0
    role: domain SFT (own-authored; target 800–1500, 60% AR / 30% EN / 10% code-switch)
    provenance: native
    count: 0

quarantined: # research-only; NEVER in a commercial manifest — listed here for audit only
  - name: AraFinNews
    license: non-commercial
    location: data/quarantine/

totals:
  records: 0
  provenance_split: { native: 0.0, translated: 0.0, synthetic: 0.0 }
  lang_split: { ar: 0.0, en: 0.0, mixed: 0.0 }

shards: [] # {path, sha256, records} — populated by manifest.py build
