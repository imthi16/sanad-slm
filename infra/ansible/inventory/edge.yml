# Edge inventory — per-device vars: board model, power mode, model version (§9.2).
all:
  children:
    edge:
      hosts:
        jetson-01:
          ansible_host: 192.168.10.21
          ansible_user: sanad
          board_model: orin-nano-8gb
          nvpmodel_mode: 0          # MAXN on Orin Nano; verify per board
          model_version: v0.1.0
          llama_ctx: 4096
          llama_parallel: 2
          llama_memory_max: 6G
      vars:
        minio_endpoint: http://192.168.10.5:9000
        models_bucket: sanad-models
        model_name: sanad-qwen3-4b-bank
        llamacpp_image: harbor.sanad.local/sanad/llamacpp-jetson:latest
        server_subnet: 192.168.10.0/24   # UFW allows 8080/9100 from here only
        api_url: http://192.168.10.5:8000
