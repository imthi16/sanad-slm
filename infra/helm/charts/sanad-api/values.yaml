image:
  repository: harbor.sanad.local/sanad/sanad-api
  tag: "" # set by CI/release
  pullPolicy: IfNotPresent

replicaCount: 2

mode: sovereign # SANAD_MODE — drives offline enforcement in-process

env:
  vllmBaseUrl: http://vllm:8000/v1
  llamacppBaseUrl: http://llamacpp:8080/v1
  redisUrl: redis://redis:6379/0
  registryS3Endpoint: http://minio.registry.svc:9000

# database_url + service_token come from a SOPS-decrypted Secret (§9.3)
existingSecret: sanad-api-secrets

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: true

service:
  port: 8000
