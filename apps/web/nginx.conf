# sanad-web — air-gapped SPA serving (§9.3). CSP self-only baked in: the sovereign posture is
# enforced at the edge of the container, not just in CI.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (§10)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxied by the ingress in k8s; compose demo proxies here
    location /v1/ {
        proxy_pass http://sanad-api:8000;
        proxy_buffering off;          # SSE
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
