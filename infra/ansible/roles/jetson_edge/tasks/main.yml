---
# jetson_edge role (§9.2) — idempotent, tagged per step.

- name: apt dependencies
  ansible.builtin.apt:
    name: [docker.io, curl, python3-pip, ufw]
    state: present
    update_cache: true
  tags: [deps]

- name: nvidia container runtime present (JetPack 6.x ships it)
  ansible.builtin.command: nvidia-container-cli --version
  register: nvruntime
  changed_when: false
  failed_when: nvruntime.rc != 0
  tags: [deps]

- name: docker daemon uses nvidia runtime
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "runtimes": {"nvidia": {"path": "nvidia-container-runtime", "runtimeArgs": []}},
        "default-runtime": "nvidia"
      }
    mode: "0644"
  notify: restart llama-server
  tags: [deps]

- name: pull pinned llamacpp image
  community.docker.docker_image:
    name: "{{ llamacpp_image }}"
    source: pull
  tags: [image]

- name: models directory
  ansible.builtin.file:
    path: "{{ models_dir }}"
    state: directory
    mode: "0755"
  tags: [model]

- name: install mc (minio client)
  ansible.builtin.get_url:
    url: https://dl.min.io/client/mc/release/linux-arm64/mc
    dest: /usr/local/bin/mc
    mode: "0755"
  tags: [model]

- name: sync GGUF from MinIO (sha256-verified)
  ansible.builtin.shell: |
    set -euo pipefail
    mc alias set sanad {{ minio_endpoint }} "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
    mc mirror --overwrite sanad/{{ models_bucket }}/{{ model_name }}/{{ model_version }}/gguf/ {{ models_dir }}/
    cd {{ models_dir }}
    sha256sum -c {{ gguf_file }}.sha256
  args:
    executable: /bin/bash
  environment:
    MINIO_ACCESS_KEY: "{{ lookup('env', 'MINIO_ACCESS_KEY') }}"
    MINIO_SECRET_KEY: "{{ lookup('env', 'MINIO_SECRET_KEY') }}"
  register: model_sync
  changed_when: "'Total: 0 B' not in model_sync.stdout"
  notify: restart llama-server
  tags: [model]

- name: install llama-server systemd unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify: restart llama-server
  tags: [service]

- name: install tegrastats exporter script
  ansible.builtin.copy:
    src: tegrastats_exporter.py
    dest: /usr/local/bin/tegrastats_exporter.py
    mode: "0755"
  notify: restart tegrastats-exporter
  tags: [telemetry]

- name: prometheus_client for the exporter
  ansible.builtin.pip:
    name: prometheus-client>=0.21
  tags: [telemetry]

- name: install tegrastats-exporter systemd unit
  ansible.builtin.template:
    src: tegrastats-exporter.service.j2
    dest: /etc/systemd/system/tegrastats-exporter.service
    mode: "0644"
  notify: restart tegrastats-exporter
  tags: [telemetry]

- name: node_exporter (arm64)
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-arm64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/node_exporter"]
    creates: /usr/local/bin/node_exporter
  tags: [telemetry]

- name: node_exporter unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/node-exporter.service
    content: |
      [Unit]
      Description=node_exporter
      [Service]
      ExecStart=/usr/local/bin/node_exporter
      Restart=always
      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  tags: [telemetry]

- name: UFW — allow llama-server + exporters from the server subnet only (§9.2)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ server_subnet }}"
  loop: ["8080", "9100", "{{ exporter_port | string }}"]
  tags: [firewall]

- name: UFW — default deny incoming, enable
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  tags: [firewall]

- name: power mode ({{ nvpmodel_mode }}) per board var
  ansible.builtin.command: nvpmodel -m {{ nvpmodel_mode }}
  register: nvp
  changed_when: "'already' not in (nvp.stderr | default(''))"
  failed_when: false
  notify: reboot board
  tags: [power]

- name: enable + start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [llama-server, tegrastats-exporter, node-exporter]
  tags: [service, telemetry]

- name: benchmark (opt-in via --tags bench) → evals/reports/edge_bench.json
  ansible.builtin.script: bench.sh {{ api_url }}
  when: "'bench' in ansible_run_tags"
  tags: [never, bench]
