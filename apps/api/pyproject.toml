# uv workspace #2 — slim FastAPI gateway. Never merged with ml/'s CUDA tree (§2).
# Floors per CLAUDE.md §3.3; uv.lock is authoritative.
[project]
name = "sanad-api"
version = "1.0.0"
description = "SANAD API gateway: OpenAI-compatible chat proxy + evals/telemetry/fertility/registry"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.116",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "redis>=6",
    "sse-starlette>=2.3",
    "httpx>=0.28",
    "structlog>=25.1",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.31",
    "opentelemetry-sdk>=1.31",
    "tokenizers>=0.21",  # fertility endpoint
    "boto3>=1.37",       # registry manifests from MinIO
]

[dependency-groups]
# synced by default with `uv sync` — lint/type/test tooling
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "schemathesis>=3.39",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanad_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Arabic-first repo: Arabic text and typographic chars in strings/comments are deliberate
# (prime directive 3) — the ambiguous-unicode rules produce only false positives here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/sanad_api"]
# SQLAlchemy-async code runs across greenlet switches — without this, every line after
# the first awaited session op is silently dropped from the trace
concurrency = ["thread", "greenlet"]
