# uv workspace #1 — CUDA-heavy training/quant/eval stack. Never merge with apps/api (§2).
# Version floors per CLAUDE.md §3.1; uv.lock (generated by `just setup`) is authoritative.
[project]
name = "sanad-ml"
version = "0.1.0"
description = "SANAD ML pipeline: data curation, QLoRA+DoRA fine-tuning, quantization, bilingual evaluation"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "structlog>=25.1",
    "numpy>=1.26",
    "datasketch>=1.6.5",          # MinHash near-dup removal (text-dedup CLI is the heavier alt)
    "boto3>=1.37",                # MinIO S3 registry
    "tokenizers>=0.21",           # fertility measurement
    "mlflow>=2.20",
]

[project.optional-dependencies]
# GPU training stack — installed on train boxes only (`uv sync --extra train`).
# Every ceiling here is Unsloth's, not ours (ADR-0006). Unsloth caps TRL below 1.0 at *every*
# release including the current one, so the former `trl>=1.0` floor was unsatisfiable alongside
# it: uv silently backtracked to unsloth 2025.7.2 — the last build with no TRL ceiling — and that
# pairing dies at import on `ConstantLengthDataset`, which TRL 1.0 moved out of
# `trl.trainer.utils`. The `unsloth>=2026.7` floor is what stops that backtrack recurring; the
# rest mirror its metadata so a bad combination fails at lock time rather than 9 s into a run.
train = [
    "torch>=2.7,<2.12",                 # unsloth: <2.12.0
    "transformers>=4.52.4,<=5.5",       # unsloth: >=4.51.3,<=5.5.0 (4.52.0–.3 excluded upstream)
    "datasets>=3.5,<4.4",               # unsloth: >=3.4.1,<4.4.0
    "accelerate>=1.6",
    "trl>=0.18.2,!=0.19.0,<=0.24",      # unsloth: the hard ceiling — see ADR-0006
    "peft>=0.18",                       # unsloth: >=0.18.0; still gives use_dora=True
    "bitsandbytes>=0.47,!=0.48.0",      # unsloth excludes 0.48.0
    "unsloth>=2026.7",
    "sentencepiece>=0.2",
]
# Quantization (GPU inference path) — llm-compressor is the vLLM-official AWQ successor;
# AutoAWQ is archived: do not add it (§3.1).
# Ceiling is Unsloth's again (ADR-0006): both extras land in one venv
# (`uv sync --extra train --extra quant`), so llm-compressor must fit inside Unsloth's windows.
# 0.12 needs transformers >=5.9 (Unsloth caps 5.5); 0.11 needs datasets >=4.8.4 (Unsloth caps
# <4.4). 0.10.x is the newest that overlaps on both axes — transformers at 4.57.6, datasets in
# [4.2, 4.4). Raising this ceiling means re-checking datasets *and* transformers, not just one.
quant = [
    "llmcompressor>=0.10,<0.11",
]
# Arabic NLP utils — normalization for retrieval/dedup keys only; SFT keeps raw text.
arabic = [
    "camel-tools>=1.5",
    "fasttext-wheel>=0.9.2",
]

[dependency-groups]
# synced by default with `uv sync` — lint/type/test tooling
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.uv]
# Resolve for the only platform this workspace ever runs on. Without this, uv's universal
# resolution also solves for darwin/arm64, where unsloth-zoo pulls mlx-vlm and mlx-vlm demands
# transformers >=5.14 — a macOS-only requirement that propagated into the shared solve and made
# every llmcompressor below 0.12 unsatisfiable. The train box, the CPU edge box and the dev
# workstation are all x86_64 Linux (ADR-0004), so nothing is lost by saying so (ADR-0006).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Arabic-first repo: Arabic text and typographic chars (–, ×, α, §) in strings/comments are
# deliberate, not confusable typos — the ambiguous-unicode rules fight prime directive 3.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true # torch/unsloth/camel_tools ship no stubs
exclude = ["out/", "data/raw/", "data/processed/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
