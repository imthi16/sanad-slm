# uv workspace #1 — CUDA-heavy training/quant/eval stack. Never merge with apps/api (§2).
# Version floors per CLAUDE.md §3.1; uv.lock (generated by `just setup`) is authoritative.
[project]
name = "sanad-ml"
version = "0.1.0"
description = "SANAD ML pipeline: data curation, QLoRA+DoRA fine-tuning, quantization, bilingual evaluation"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "structlog>=25.1",
    "numpy>=1.26",
    "datasketch>=1.6.5",          # MinHash near-dup removal (text-dedup CLI is the heavier alt)
    "boto3>=1.37",                # MinIO S3 registry
    "tokenizers>=0.21",           # fertility measurement
    "mlflow>=2.20",
]

[project.optional-dependencies]
# GPU training stack — installed on train boxes only (`uv sync --extra train`).
train = [
    "torch>=2.7",
    "transformers>=4.52",
    "datasets>=3.5",
    "accelerate>=1.6",
    "trl>=1.0",
    "peft>=0.17",
    "bitsandbytes>=0.47",
    "unsloth>=2025.3",
    "sentencepiece>=0.2",
]
# Quantization (GPU inference path) — llm-compressor is the vLLM-official AWQ successor;
# AutoAWQ is archived: do not add it (§3.1).
quant = [
    "llmcompressor>=0.6",
]
# Arabic NLP utils — normalization for retrieval/dedup keys only; SFT keeps raw text.
arabic = [
    "camel-tools>=1.5",
    "fasttext-wheel>=0.9.2",
]

[dependency-groups]
# synced by default with `uv sync` — lint/type/test tooling
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Arabic-first repo: Arabic text and typographic chars (–, ×, α, §) in strings/comments are
# deliberate, not confusable typos — the ambiguous-unicode rules fight prime directive 3.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true # torch/unsloth/camel_tools ship no stubs
exclude = ["out/", "data/raw/", "data/processed/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
