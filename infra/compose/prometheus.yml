# Dev-stack Prometheus (§9.4). K8s scraping is owned by kube-prometheus-stack ServiceMonitors.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sanad-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"] # vLLM exposes /metrics natively

  - job_name: llamacpp
    static_configs:
      - targets: ["llamacpp:8080"] # --metrics flag

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
