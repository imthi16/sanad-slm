# PR gate — mirrors `just check` plus container supply-chain steps (CLAUDE.md §9.5, §11).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write # cosign keyless

env:
  UV_VERSION: "0.7.13"
  NODE_VERSION: "22"

jobs:
  python-ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}" }
      # base + dev group only — the train/quant CUDA extras never install on CI runners
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q
      - name: data-gate (license/provenance)
        run: uv run python data/scripts/manifest.py gate --profile commercial

  python-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: sanad, POSTGRES_PASSWORD: sanad, POSTGRES_DB: sanad }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sanad" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=src/sanad_api/services --cov=src/sanad_api/routers --cov-fail-under=80
      - name: alembic up/down smoke
        env:
          SANAD_DATABASE_URL: postgresql+asyncpg://sanad:sanad@localhost:5432/sanad
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: schemathesis (OpenAPI fuzz)
        env:
          SANAD_DATABASE_URL: postgresql+asyncpg://sanad:sanad@localhost:5432/sanad
          SANAD_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head   # up/down smoke above leaves the DB at base
          uv run uvicorn sanad_api.main:app --port 8000 &
          sleep 3
          # Gate: no 5xx on garbage input. Paths that respond 5xx BY DESIGN in this
          # upstream-less env are excluded rather than silenced app-side:
          #   /readyz → 503 degraded (no vLLM)  ·  /v1/chat/completions → 502 unreachable
          #   /v1/tokenize/fertility → 503 (no tokenizer.json synced)
          #   /v1/telemetry/stream → infinite SSE (fuzzing it never returns)
          uv run schemathesis run http://localhost:8000/openapi.json \
            --checks not_a_server_error --max-examples 25 --request-timeout 10 \
            --exclude-path /readyz \
            --exclude-path /v1/chat/completions \
            --exclude-path /v1/tokenize/fertility \
            --exclude-path /v1/telemetry/stream || exit 1

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      # Version comes from apps/web/package.json `packageManager`, so it cannot drift from the
      # image. The action resolves that file relative to the repo root, not the job's
      # working-directory, so it has to be named explicitly.
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec tsc --noEmit
      - name: bilingual string sync (en ⇄ ar)
        run: node scripts/check-i18n-sync.mjs
      - name: logical-properties grep (RTL safety)
        run: |
          ! grep -rnE '(\bml-|\bmr-|\bpl-|\bpr-|text-left|text-right)' src \
            --include='*.tsx' --include='*.ts' --include='*.css'
      - run: pnpm test -- --run
      - run: pnpm build
      - name: verify-no-cdn (sovereign gate)
        run: node scripts/verify-no-cdn.mjs dist
      - name: playwright smoke (LTR + RTL)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=chromium

  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "1.8.5" }
      - name: tofu validate (all envs, offline)
        run: |
          for env in dev prod; do
            (cd infra/terraform/envs/$env && tofu init -backend=false && tofu validate)
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra/terraform --recursive || true
      - uses: azure/setup-helm@v4
      - run: for c in infra/helm/charts/*/; do helm lint "$c"; done
      - name: ansible-lint
        run: pipx run ansible-lint infra/ansible || true

  action-refs:
    # A `uses:` pointing at a tag that does not exist fails the job during "Set up job",
    # before any step runs and before any log the UI surfaces clearly. That is how
    # aquasecurity/trivy-action@0.29.0 (real tags carry a `v` prefix) kept `images` red for
    # three merges. Resolving every reference up front turns that into a named failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every `uses:` resolves to a real tag, branch or commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail=0
          # Capture the whole `uses:` value, not owner/repo@ref only: nested actions and reusable
          # workflows are `owner/repo/path/to/action@ref`, and matching `@` right after the repo
          # name skips them — which would leave exactly the blind spot this job exists to close.
          # Anchored to the start of the line so `uses:` appearing in prose (a step name, a
          # comment) is not mistaken for a key.
          refs=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]#]+' \
                   .github/workflows/ \
                 | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//' | sort -u)
          echo "parsed $(printf '%s\n' "$refs" | wc -l) references"
          # read line by line rather than relying on word-splitting an unquoted variable
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            case "$ref" in
              ./*|docker://*) echo "skip     $ref (local or docker action)"; continue ;;
              *@*) ;;
              *) echo "UNPINNED $ref (no @ref)"; fail=1; continue ;;
            esac
            spec="${ref%@*}"                     # owner/repo[/path…]
            version="${ref##*@}"                 # tag, branch or commit sha
            owner=$(printf '%s' "$spec" | cut -d/ -f1)
            repo=$(printf '%s' "$spec" | cut -d/ -f2)
            if [ -z "$owner" ] || [ -z "$repo" ]; then
              echo "BROKEN   $ref (not owner/repo)"; fail=1; continue
            fi
            if gh api "repos/$owner/$repo/git/ref/tags/$version" >/dev/null 2>&1 \
            || gh api "repos/$owner/$repo/git/ref/heads/$version" >/dev/null 2>&1 \
            || gh api "repos/$owner/$repo/commits/$version" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "BROKEN   $ref"; fail=1
            fi
          done <<< "$refs"
          exit $fail

  images:
    # build → scan → SBOM, then sign+push only where a registry actually exists.
    if: github.event_name == 'push'
    needs: [python-api, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: sanad-api, context: apps/api }
          - { name: sanad-web, context: apps/web }
    env:
      # Build and scan against a local tag so the security gates do not depend on a registry.
      # Harbor is self-hosted and does not exist on the zero-cost track (ADR-0003), so the
      # publish steps below are skipped unless HARBOR_HOST is configured. Skipped, not faked:
      # a green tick here means the image really was built, scanned and SBOM'd.
      LOCAL_TAG: sanad/${{ matrix.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          tags: ${{ env.LOCAL_TAG }}
          load: true
      - name: trivy scan (0 high/critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: syft SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_TAG }}
          artifact-name: ${{ matrix.name }}-sbom.spdx.json
      - name: publish to Harbor (only when a registry is configured)
        if: vars.HARBOR_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}
      - name: install cosign
        if: vars.HARBOR_HOST != ''
        uses: sigstore/cosign-installer@v3
      - name: retag, push and sign
        if: vars.HARBOR_HOST != ''
        run: |
          remote="${{ vars.HARBOR_HOST }}/sanad/${{ matrix.name }}:${{ github.sha }}"
          docker tag "$LOCAL_TAG" "$remote"
          docker push "$remote"
          cosign sign --yes "$remote"
